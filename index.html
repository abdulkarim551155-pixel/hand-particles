<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جزيئات اليد</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: system-ui, "Segoe UI", Tahoma, sans-serif; color: #fff; }
  #scene { position: fixed; inset: 0; }
  /* معاينة الكاميرا الصغيرة في الزاوية */
  #preview { position: fixed; left: 16px; bottom: 16px; width: 220px; aspect-ratio: 4/3;
    border-radius: 12px; overflow: hidden; border: 1px solid #ffffff33; opacity: .85; }
  #preview video, #preview canvas { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); }
  #hud { position: fixed; top: 16px; right: 16px; background: #0008; padding: 10px 14px;
    border-radius: 10px; font-size: 14px; line-height: 1.7; backdrop-filter: blur(6px); }
  #hud b { color: #7fd6ff; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: #000c; }
  #start button { font: inherit; font-size: 20px; padding: 14px 32px; border-radius: 999px;
    border: 0; background: #7fd6ff; color: #000; cursor: pointer; }
  #status { margin-top: 12px; text-align: center; color: #aaa; }
</style>
</head>
<body>
<div id="scene"></div>

<div id="preview">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div id="hud">
  الشكل: <b id="shapeName">كرة</b><br>
  اليد: <b id="handState">—</b><br>
  ✋ افتح يدك = تتوسع · ✊ اقبض = تنضم<br>
  👌 اقرص (إبهام + سبابة) = شكل جديد<br>
  ☝️ حرّك إصبعك = تدفع الجزيئات<br>
  ⌨️ المسافة / الأسهم = تغيير الشكل
</div>

<div id="start">
  <div>
    <button id="startBtn">ابدأ الكاميرا</button>
    <div id="status">يحتاج إذن الكاميرا</div>
  </div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ===================== 1) مشهد Three.js =====================
const COUNT = 9000;                       // عدد الجزيئات
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
camera.position.z = 60;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById("scene").appendChild(renderer.domElement);

// صورة دائرية ناعمة لكل جزيء (بدل المربع)
function dotTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, "rgba(255,255,255,1)");
  grad.addColorStop(0.3, "rgba(255,255,255,.6)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

const positions = new Float32Array(COUNT * 3);   // المكان الحالي
const velocities = new Float32Array(COUNT * 3);  // السرعة
const colors = new Float32Array(COUNT * 3);
const geometry = new THREE.BufferGeometry();
geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
const material = new THREE.PointsMaterial({
  size: 0.7, map: dotTexture(), vertexColors: true, transparent: true,
  depthWrite: false, blending: THREE.AdditiveBlending,
});
scene.add(new THREE.Points(geometry, material));

// ===================== 2) الأشكال =====================
// كل شكل = قائمة نقاط هدف، الجزيئات تطير لها
const rnd = (a, b) => a + Math.random() * (b - a);
const SHAPES = [
  { name: "كرة", hue: 0.55, make(i) {
      const y = 1 - (i / (COUNT - 1)) * 2, r = Math.sqrt(1 - y * y), t = i * 2.39996;
      return [Math.cos(t) * r * 16, y * 16, Math.sin(t) * r * 16];
  }},
  { name: "قلب", hue: 0.95, make() {
      // نختار نقاط عشوائية ونحتفظ باللي داخل معادلة القلب: (x²+y²-1)³ - x²y³ < 0
      for (;;) {
        const x = rnd(-1.2, 1.2), y = rnd(-1.1, 1.3);
        const a = x * x + y * y - 1;
        if (a * a * a - x * x * y * y * y < 0) {
          const depth = Math.sqrt(Math.max(0, -a)) * 4;   // أسمك في النص
          return [x * 15, y * 15, rnd(-depth, depth)];
        }
      }
  }},
  { name: "حلقة", hue: 0.8, make() {
      const u = rnd(0, Math.PI * 2), v = rnd(0, Math.PI * 2), R = 13, r = 4;
      return [(R + r * Math.cos(v)) * Math.cos(u), r * Math.sin(v), (R + r * Math.cos(v)) * Math.sin(u)];
  }},
  { name: "مجرة", hue: 0.12, make(i) {
      const arm = i % 3, d = Math.pow(Math.random(), 0.6) * 22;
      const a = arm * (Math.PI * 2 / 3) + d * 0.28 + rnd(-0.3, 0.3);
      return [Math.cos(a) * d, rnd(-1, 1) * (3 - d * 0.1), Math.sin(a) * d];
  }},
  { name: "نجمة", hue: 0.14, still: true, make() {
      // نجمة خماسية: نصف القطر يتبدل بين رأس (طويل) وزاوية داخلية (قصير)
      const a = rnd(0, Math.PI * 2), seg = Math.PI / 5;
      const f = Math.abs(((a % (2 * seg)) - seg) / seg);       // 1 عند الرأس، 0 بين الرأسين
      const edge = 7 + 11 * f, r = Math.sqrt(Math.random()) * edge;
      return [Math.sin(a) * r, Math.cos(a) * r, rnd(-2, 2) * (1 - r / 20)];
  }},
  { name: "مكعب", hue: 0.33, make() {
      // نقاط على أوجه المكعب الستة
      const p = [rnd(-11, 11), rnd(-11, 11), rnd(-11, 11)];
      p[Math.floor(Math.random() * 3)] = Math.random() < 0.5 ? -11 : 11;
      return p;
  }},
  { name: "DNA", hue: 0.48, make(i) {
      // حلزونين ملتفين + درجات بينهم
      const t = rnd(-1, 1), a = t * Math.PI * 4, y = t * 20;
      if (i % 5 === 0) {                                       // الدرجات
        const step = Math.round(t * 16) / 16, b = step * Math.PI * 4, s = rnd(-1, 1);
        return [Math.cos(b) * 7 * s, step * 20, Math.sin(b) * 7 * s];
      }
      const side = i % 2 ? 0 : Math.PI;
      return [Math.cos(a + side) * 7 + rnd(-.4, .4), y, Math.sin(a + side) * 7 + rnd(-.4, .4)];
  }},
  { name: "إعصار", hue: 0.6, make() {
      // قمع يوسع للأعلى، النقاط ملتفة حوله مع شوية فوضى
      const t = Math.pow(Math.random(), 0.8), a = rnd(0, Math.PI * 2) + t * 10;
      const r = (1.5 + t * t * 15) * rnd(0.75, 1.1);
      return [Math.cos(a) * r, t * 34 - 17, Math.sin(a) * r];
  }},
  { name: "زحل", hue: 0.08, make(i) {
      if (i % 3 === 0) {                                       // الكوكب
        const y = rnd(-1, 1), r = Math.sqrt(1 - y * y), t = rnd(0, Math.PI * 2);
        return [Math.cos(t) * r * 8, y * 8, Math.sin(t) * r * 8];
      }
      const t = rnd(0, Math.PI * 2), r = rnd(11, 20), tilt = 0.4;   // الحلقة مايلة
      const x = Math.cos(t) * r, z = Math.sin(t) * r;
      return [x, z * Math.sin(tilt) + rnd(-.3, .3), z * Math.cos(tilt)];
  }},
  { name: "فراشة", hue: 0.75, still: true, make() {
      // منحنى الفراشة المشهور
      const t = rnd(0, Math.PI * 12), s = Math.sqrt(Math.random());
      const r = Math.exp(Math.cos(t)) - 2 * Math.cos(4 * t) - Math.sin(t / 12) ** 5;
      return [Math.sin(t) * r * 4.5 * s, Math.cos(t) * r * 4.5 * s + 2, rnd(-1.5, 1.5)];
  }},
  { name: "وردة", hue: 0.9, still: true, make() {
      // وردة رياضية: r = |cos(4θ)| تعطي 8 بتلات
      const t = rnd(0, Math.PI * 2), r = Math.abs(Math.cos(4 * t)) * 18 * Math.sqrt(Math.random());
      return [Math.cos(t) * r, Math.sin(t) * r, (18 - r) * 0.25 * rnd(-1, 1)];
  }},
  { name: "موجة", hue: 0.52, make() {
      const x = rnd(-24, 24), z = rnd(-24, 24), d = Math.hypot(x, z);
      return [x, Math.sin(d * 0.45) * 4 * Math.exp(-d / 30) - 2, z];
  }},
  { name: "نص", hue: 0.1, still: true, make() {
      const p = textPoints("أهلاً");
      const [x, y] = p[Math.floor(Math.random() * p.length)];
      return [x + rnd(-.15, .15), y + rnd(-.15, .15), rnd(-1.5, 1.5)];
  }},
];

// يرسم كلمة على كانفس مخفي ويرجع أماكن البكسلات الملونة كنقاط
const textCache = {};
function textPoints(word) {
  if (textCache[word]) return textCache[word];
  const c = document.createElement("canvas"); c.width = 600; c.height = 200;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.font = "bold 140px Tahoma, sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle"; g.direction = "rtl";
  g.fillText(word, 300, 100);
  const data = g.getImageData(0, 0, 600, 200).data, pts = [];
  for (let y = 0; y < 200; y += 2)
    for (let x = 0; x < 600; x += 2)
      if (data[(y * 600 + x) * 4 + 3] > 128) pts.push([(x - 300) / 9, (100 - y) / 9]);
  return (textCache[word] = pts);
}
let shapeIndex = 0;
let targets = new Float32Array(COUNT * 3);

function setShape(idx) {
  shapeIndex = idx % SHAPES.length;
  const s = SHAPES[shapeIndex];
  const col = new THREE.Color();
  for (let i = 0; i < COUNT; i++) {
    const [x, y, z] = s.make(i);
    targets.set([x, y, z], i * 3);
    col.setHSL((s.hue + rnd(-0.06, 0.06) + 1) % 1, 0.9, rnd(0.45, 0.7));
    colors.set([col.r, col.g, col.b], i * 3);
  }
  geometry.attributes.color.needsUpdate = true;
  document.getElementById("shapeName").textContent = `${s.name} (${shapeIndex + 1}/${SHAPES.length})`;
}

// بداية: الجزيئات مبعثرة عشوائياً
for (let i = 0; i < COUNT * 3; i++) positions[i] = rnd(-60, 60);
setShape(0);

// ===================== 3) تتبع اليد (MediaPipe) =====================
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const octx = overlay.getContext("2d");
let landmarker = null;
let lastVideoTime = -1;

async function start() {
  const status = document.getElementById("status");
  try {
    status.textContent = "جاري تحميل نموذج تتبع اليد...";
    const files = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opts = (delegate) => ({
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate,
      },
      runningMode: "VIDEO", numHands: 1,
    });
    try { landmarker = await HandLandmarker.createFromOptions(files, opts("GPU")); }
    catch { landmarker = await HandLandmarker.createFromOptions(files, opts("CPU")); }

    status.textContent = "جاري فتح الكاميرا...";
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: "user" } });
    await video.play();
    overlay.width = video.videoWidth; overlay.height = video.videoHeight;
    document.getElementById("start").remove();
  } catch (err) {
    console.error(err);
    status.textContent = "صار خطأ: " + err.message;
  }
}
document.getElementById("startBtn").onclick = start;

// خطوط هيكل اليد (أي نقطة توصل بأي نقطة) للرسم في المعاينة
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function drawHand(lm) {
  octx.clearRect(0, 0, overlay.width, overlay.height);
  if (!lm) return;
  const W = overlay.width, H = overlay.height;
  octx.strokeStyle = "#7fd6ff"; octx.lineWidth = 3;
  for (const [a, b] of BONES) {
    octx.beginPath();
    octx.moveTo(lm[a].x * W, lm[a].y * H); octx.lineTo(lm[b].x * W, lm[b].y * H);
    octx.stroke();
  }
  octx.fillStyle = "#fff";
  for (const p of lm) { octx.beginPath(); octx.arc(p.x * W, p.y * H, 4, 0, 7); octx.fill(); }
}

// ===================== 4) قراءة الإيماءات =====================
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);

// يحوّل نقطة من الكاميرا (0..1) إلى مكان في المشهد ثلاثي الأبعاد
function toWorld(p) {
  const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
  const halfW = halfH * camera.aspect;
  return new THREE.Vector3((0.5 - p.x) * 2 * halfW, (0.5 - p.y) * 2 * halfH, 0); // (0.5 - x) = مرآة
}

const hand = {
  present: false,
  center: new THREE.Vector3(),   // مركز الشكل يتبع كف اليد
  finger: new THREE.Vector3(),   // طرف السبابة
  spread: 1,                     // 0.4 مقبوضة ... 1.7 مفتوحة
  pinching: false,
};

function readGestures(lm) {
  if (!lm) { hand.present = false; return; }
  hand.present = true;
  const palm = dist(lm[0], lm[9]);                       // حجم الكف (من الرسغ لأصل الوسطى)
  const tips = [8, 12, 16, 20].map(i => dist(lm[i], lm[0]) / palm);
  const openness = tips.reduce((a, b) => a + b) / 4;      // ~1 مقبوضة، ~2 مفتوحة
  const pinch = dist(lm[4], lm[8]) / palm;                // قرب الإبهام من السبابة

  hand.spread = THREE.MathUtils.clamp(THREE.MathUtils.mapLinear(openness, 1.0, 1.9, 0.35, 1.7), 0.35, 1.7);
  hand.center.lerp(toWorld(lm[9]), 0.25);
  hand.finger.copy(toWorld(lm[8]));

  const nowPinching = pinch < 0.3;
  if (nowPinching && !hand.pinching) setShape(shapeIndex + 1);   // قرصة جديدة = الشكل التالي
  hand.pinching = nowPinching;

  document.getElementById("handState").textContent =
    nowPinching ? "قرصة 👌" : openness > 1.6 ? "مفتوحة ✋" : openness < 1.2 ? "مقبوضة ✊" : "نص نص";
}

// ===================== 5) الحركة (كل إطار) =====================
let rotY = 0, spread = 1;
const center = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);

  // نشغل تتبع اليد فقط لما تجي لقطة جديدة من الكاميرا
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    const lm = res.landmarks[0];
    readGestures(lm);
    drawHand(lm);
  }

  // لو ما فيه يد، يرجع الشكل للنص وبحجمه العادي
  if (!hand.present) { hand.center.lerp(new THREE.Vector3(), 0.03); hand.spread = 1; }
  center.lerp(hand.center, 0.15);
  spread += (hand.spread - spread) * 0.1;
  // الأشكال المسطحة (نص، فراشة...) تتمايل بس عشان ما تختفي من الجنب، الباقي يدور ببطء
  if (SHAPES[shapeIndex].still) {
    const sway = Math.round(rotY / (Math.PI * 2)) * Math.PI * 2 + Math.sin(performance.now() / 1200) * 0.45;
    rotY += (sway - rotY) * 0.05;
  }
  else rotY += 0.004;
  const cos = Math.cos(rotY), sin = Math.sin(rotY);

  for (let i = 0; i < COUNT; i++) {
    const k = i * 3;
    // الهدف = نقطة الشكل بعد الدوران والتكبير والتحريك لمكان اليد
    const tx = targets[k], ty = targets[k + 1], tz = targets[k + 2];
    const gx = (tx * cos - tz * sin) * spread + center.x;
    const gy = ty * spread + center.y;
    const gz = (tx * sin + tz * cos) * spread;

    // قوة نابض تسحب الجزيء لهدفه
    velocities[k]     += (gx - positions[k])     * 0.015;
    velocities[k + 1] += (gy - positions[k + 1]) * 0.015;
    velocities[k + 2] += (gz - positions[k + 2]) * 0.015;

    // طرف السبابة يدفع الجزيئات القريبة بعيد
    if (hand.present) {
      const dx = positions[k] - hand.finger.x, dy = positions[k + 1] - hand.finger.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 36 && d2 > 0.01) {
        const d = Math.sqrt(d2), f = (1 - d / 6) * 1.2;
        velocities[k] += (dx / d) * f; velocities[k + 1] += (dy / d) * f;
        velocities[k + 2] += rnd(-0.5, 0.5);
      }
    }

    // احتكاك ثم تحريك
    velocities[k] *= 0.88; velocities[k + 1] *= 0.88; velocities[k + 2] *= 0.88;
    positions[k] += velocities[k]; positions[k + 1] += velocities[k + 1]; positions[k + 2] += velocities[k + 2];
  }
  geometry.attributes.position.needsUpdate = true;
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
// للتجربة بدون كاميرا: المسافة أو الأسهم تغيّر الشكل
addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowLeft") setShape(shapeIndex + 1);
  if (e.code === "ArrowRight") setShape(shapeIndex - 1 + SHAPES.length);
});
</script>
</body>
</html>
