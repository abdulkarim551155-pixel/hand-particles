<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جزيئات اليد</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: system-ui, "Segoe UI", Tahoma, sans-serif; color: #fff; }
  #scene, #cursors { position: fixed; inset: 0; }
  #cursors { pointer-events: none; width: 100%; height: 100%; }
  /* معاينة الكاميرا الصغيرة في الزاوية */
  #preview { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    width: min(200px, 34vw); aspect-ratio: 4/3; border-radius: 12px; overflow: hidden;
    border: 1px solid #ffffff33; opacity: .8; }
  #preview video, #preview canvas { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); }
  #hud { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; left: 12px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
  #shapeName { font-size: clamp(22px, 6vw, 34px); font-weight: 700; color: #7fd6ff;
    text-shadow: 0 0 18px currentColor; }
  #handState { font-size: 14px; color: #bbb; margin-top: 2px; }
  #help { background: #0009; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.75;
    backdrop-filter: blur(6px); pointer-events: auto; max-width: 250px; }
  #help summary { cursor: pointer; color: #7fd6ff; }
  #help b { color: #fff; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: #000c; padding: 16px; }
  #start button { font: inherit; font-size: 20px; padding: 14px 32px; border-radius: 999px;
    border: 0; background: #7fd6ff; color: #000; cursor: pointer; }
  #status { margin-top: 12px; text-align: center; color: #aaa; }
</style>
</head>
<body>
<div id="scene"></div>
<canvas id="cursors"></canvas>

<div id="preview">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div id="hud">
  <div>
    <div id="shapeName">كرة</div>
    <div id="handState">ما فيه يد</div>
  </div>
  <details id="help" open>
    <summary>التحكم</summary>
    ✋ <b>كف مفتوح</b> = تحرك الشكل<br>
    ✊ <b>قبضة</b> = تمسكه وتلفّه<br>
    👌 <b>قرصة</b> = الشكل التالي<br>
    ✌️ <b>علامة النصر</b> = الشكل السابق<br>
    🙌 <b>يدين</b>: بعّدهم = يكبر، قرّبهم = يصغر، ميّلهم = يدور
  </details>
</div>

<div id="start">
  <div>
    <button id="startBtn">ابدأ الكاميرا</button>
    <div id="status">يحتاج إذن الكاميرا</div>
  </div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ===================== 1) مشهد Three.js =====================
const COUNT = 9000;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
camera.position.z = 60;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById("scene").appendChild(renderer.domElement);

function dotTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, "rgba(255,255,255,1)");
  grad.addColorStop(0.3, "rgba(255,255,255,.6)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

const positions = new Float32Array(COUNT * 3);
const velocities = new Float32Array(COUNT * 3);
const colors = new Float32Array(COUNT * 3);
const geometry = new THREE.BufferGeometry();
geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
const material = new THREE.PointsMaterial({
  size: 0.7, map: dotTexture(), vertexColors: true, transparent: true,
  depthWrite: false, blending: THREE.AdditiveBlending,
});
scene.add(new THREE.Points(geometry, material));

// ===================== 2) الأشكال =====================
// كل شكل = قائمة نقاط هدف، الجزيئات تطير لها
const rnd = (a, b) => a + Math.random() * (b - a);
const SHAPES = [
  { name: "كرة", hue: 0.55, make(i) {
      const y = 1 - (i / (COUNT - 1)) * 2, r = Math.sqrt(1 - y * y), t = i * 2.39996;
      return [Math.cos(t) * r * 16, y * 16, Math.sin(t) * r * 16];
  }},
  { name: "قلب", hue: 0.95, make() {
      // نختار نقاط عشوائية ونحتفظ باللي داخل معادلة القلب: (x²+y²-1)³ - x²y³ < 0
      for (;;) {
        const x = rnd(-1.2, 1.2), y = rnd(-1.1, 1.3);
        const a = x * x + y * y - 1;
        if (a * a * a - x * x * y * y * y < 0) {
          const depth = Math.sqrt(Math.max(0, -a)) * 4;   // أسمك في النص
          return [x * 15, y * 15, rnd(-depth, depth)];
        }
      }
  }},
  { name: "حلقة", hue: 0.8, make() {
      const u = rnd(0, Math.PI * 2), v = rnd(0, Math.PI * 2), R = 13, r = 4;
      return [(R + r * Math.cos(v)) * Math.cos(u), r * Math.sin(v), (R + r * Math.cos(v)) * Math.sin(u)];
  }},
  { name: "مجرة", hue: 0.12, make(i) {
      const arm = i % 3, d = Math.pow(Math.random(), 0.6) * 22;
      const a = arm * (Math.PI * 2 / 3) + d * 0.28 + rnd(-0.3, 0.3);
      return [Math.cos(a) * d, rnd(-1, 1) * (3 - d * 0.1), Math.sin(a) * d];
  }},
  { name: "نجمة", hue: 0.14, still: true, make() {
      // نجمة خماسية: نصف القطر يتبدل بين رأس (طويل) وزاوية داخلية (قصير)
      const a = rnd(0, Math.PI * 2), seg = Math.PI / 5;
      const f = Math.abs(((a % (2 * seg)) - seg) / seg);       // 1 عند الرأس، 0 بين الرأسين
      const edge = 7 + 11 * f, r = Math.sqrt(Math.random()) * edge;
      return [Math.sin(a) * r, Math.cos(a) * r, rnd(-2, 2) * (1 - r / 20)];
  }},
  { name: "مكعب", hue: 0.33, make() {
      // نقاط على أوجه المكعب الستة
      const p = [rnd(-11, 11), rnd(-11, 11), rnd(-11, 11)];
      p[Math.floor(Math.random() * 3)] = Math.random() < 0.5 ? -11 : 11;
      return p;
  }},
  { name: "DNA", hue: 0.48, make(i) {
      // حلزونين ملتفين + درجات بينهم
      const t = rnd(-1, 1), a = t * Math.PI * 4, y = t * 20;
      if (i % 5 === 0) {                                       // الدرجات
        const step = Math.round(t * 16) / 16, b = step * Math.PI * 4, s = rnd(-1, 1);
        return [Math.cos(b) * 7 * s, step * 20, Math.sin(b) * 7 * s];
      }
      const side = i % 2 ? 0 : Math.PI;
      return [Math.cos(a + side) * 7 + rnd(-.4, .4), y, Math.sin(a + side) * 7 + rnd(-.4, .4)];
  }},
  { name: "إعصار", hue: 0.6, make() {
      // قمع يوسع للأعلى، النقاط ملتفة حوله مع شوية فوضى
      const t = Math.pow(Math.random(), 0.8), a = rnd(0, Math.PI * 2) + t * 10;
      const r = (1.5 + t * t * 15) * rnd(0.75, 1.1);
      return [Math.cos(a) * r, t * 34 - 17, Math.sin(a) * r];
  }},
  { name: "زحل", hue: 0.08, make(i) {
      if (i % 3 === 0) {                                       // الكوكب
        const y = rnd(-1, 1), r = Math.sqrt(1 - y * y), t = rnd(0, Math.PI * 2);
        return [Math.cos(t) * r * 8, y * 8, Math.sin(t) * r * 8];
      }
      const t = rnd(0, Math.PI * 2), r = rnd(11, 20), tilt = 0.4;   // الحلقة مايلة
      const x = Math.cos(t) * r, z = Math.sin(t) * r;
      return [x, z * Math.sin(tilt) + rnd(-.3, .3), z * Math.cos(tilt)];
  }},
  { name: "فراشة", hue: 0.75, still: true, make() {
      // منحنى الفراشة المشهور
      const t = rnd(0, Math.PI * 12), s = Math.sqrt(Math.random());
      const r = Math.exp(Math.cos(t)) - 2 * Math.cos(4 * t) - Math.sin(t / 12) ** 5;
      return [Math.sin(t) * r * 4.5 * s, Math.cos(t) * r * 4.5 * s + 2, rnd(-1.5, 1.5)];
  }},
  { name: "وردة", hue: 0.9, still: true, make() {
      // وردة رياضية: r = |cos(4θ)| تعطي 8 بتلات
      const t = rnd(0, Math.PI * 2), r = Math.abs(Math.cos(4 * t)) * 18 * Math.sqrt(Math.random());
      return [Math.cos(t) * r, Math.sin(t) * r, (18 - r) * 0.25 * rnd(-1, 1)];
  }},
  { name: "موجة", hue: 0.52, make() {
      const x = rnd(-24, 24), z = rnd(-24, 24), d = Math.hypot(x, z);
      return [x, Math.sin(d * 0.45) * 4 * Math.exp(-d / 30) - 2, z];
  }},
  { name: "نص", hue: 0.1, still: true, make() {
      const p = textPoints("أهلاً");
      const [x, y] = p[Math.floor(Math.random() * p.length)];
      return [x + rnd(-.15, .15), y + rnd(-.15, .15), rnd(-1.5, 1.5)];
  }},
];

// يرسم كلمة على كانفس مخفي ويرجع أماكن البكسلات الملونة كنقاط
const textCache = {};
function textPoints(word) {
  if (textCache[word]) return textCache[word];
  const c = document.createElement("canvas"); c.width = 600; c.height = 200;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.font = "bold 140px Tahoma, sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle"; g.direction = "rtl";
  g.fillText(word, 300, 100);
  const data = g.getImageData(0, 0, 600, 200).data, pts = [];
  for (let y = 0; y < 200; y += 2)
    for (let x = 0; x < 600; x += 2)
      if (data[(y * 600 + x) * 4 + 3] > 128) pts.push([(x - 300) / 9, (100 - y) / 9]);
  return (textCache[word] = pts);
}
let shapeIndex = 0;
let targets = new Float32Array(COUNT * 3);

function setShape(idx) {
  shapeIndex = idx % SHAPES.length;
  const s = SHAPES[shapeIndex];
  const col = new THREE.Color();
  for (let i = 0; i < COUNT; i++) {
    const [x, y, z] = s.make(i);
    targets.set([x, y, z], i * 3);
    col.setHSL((s.hue + rnd(-0.06, 0.06) + 1) % 1, 0.9, rnd(0.45, 0.7));
    colors.set([col.r, col.g, col.b], i * 3);
  }
  geometry.attributes.color.needsUpdate = true;
  document.getElementById("shapeName").textContent = `${s.name} (${shapeIndex + 1}/${SHAPES.length})`;
}

// بداية: الجزيئات مبعثرة عشوائياً
for (let i = 0; i < COUNT * 3; i++) positions[i] = rnd(-60, 60);
setShape(0);

// لون العنوان يتبع لون الشكل
const _setShape = setShape;
function showShape() {
  const s = SHAPES[shapeIndex];
  document.getElementById("shapeName").textContent = `${s.name} (${shapeIndex + 1}/${SHAPES.length})`;
  document.getElementById("shapeName").style.color = new THREE.Color().setHSL(s.hue, 0.85, 0.68).getStyle();
}
function changeShape(i) { _setShape((i + SHAPES.length) % SHAPES.length); showShape(); }
showShape();

// ===================== 3) تتبع اليد (MediaPipe) =====================
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const octx = overlay.getContext("2d");
let landmarker = null;
let lastVideoTime = -1;

async function start() {
  const status = document.getElementById("status");
  try {
    status.textContent = "جاري تحميل نموذج تتبع اليد...";
    const files = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opts = (delegate) => ({
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate,
      },
      runningMode: "VIDEO", numHands: 2,          // يدين
    });
    try { landmarker = await HandLandmarker.createFromOptions(files, opts("GPU")); }
    catch { landmarker = await HandLandmarker.createFromOptions(files, opts("CPU")); }

    status.textContent = "جاري فتح الكاميرا...";
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: "user" } });
    await video.play();
    overlay.width = video.videoWidth; overlay.height = video.videoHeight;
    document.getElementById("start").remove();
    // نسكّر الشرح بعد شوي عشان ما يغطي الشكل في الجوال
    setTimeout(() => { if (innerWidth < 700) document.getElementById("help").open = false; }, 6000);
  } catch (err) {
    console.error(err);
    status.textContent = "صار خطأ: " + err.message;
  }
}
document.getElementById("startBtn").onclick = start;

const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function drawHands(hands) {
  octx.clearRect(0, 0, overlay.width, overlay.height);
  const W = overlay.width, H = overlay.height;
  for (const lm of hands) {
    octx.strokeStyle = "#7fd6ff"; octx.lineWidth = 3;
    for (const [a, b] of BONES) {
      octx.beginPath();
      octx.moveTo(lm[a].x * W, lm[a].y * H); octx.lineTo(lm[b].x * W, lm[b].y * H);
      octx.stroke();
    }
    octx.fillStyle = "#fff";
    for (const p of lm) { octx.beginPath(); octx.arc(p.x * W, p.y * H, 4, 0, 7); octx.fill(); }
  }
}

// ===================== 4) قراءة الإيماءات =====================
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);

// الإصبع ممدود لو طرفه أبعد عن الرسغ من المفصل اللي تحته
const FINGERS = [[8, 6], [12, 10], [16, 14], [20, 18]];   // سبابة، وسطى، بنصر، خنصر
function classify(lm) {
  const palm = dist(lm[0], lm[9]);
  if (dist(lm[4], lm[8]) / palm < 0.28) return "pinch";
  const up = FINGERS.map(([tip, pip]) => dist(lm[tip], lm[0]) > dist(lm[pip], lm[0]) * 1.12);
  const n = up.filter(Boolean).length;
  if (n === 0) return "fist";
  if (up[0] && up[1] && !up[2] && !up[3]) return "peace";
  if (n >= 3) return "open";
  return "other";
}

// كل يد لها حالة خاصة: الإيماءة لازم تثبت كم إطار عشان ما ترجف
function makeHand() {
  return { seen: false, x: 0.5, y: 0.5, raw: "none", count: 0, gesture: "none" };
}
const H = [makeHand(), makeHand()];
const STABLE = 4;   // كم إطار لازم تثبت الإيماءة

function updateHands(list) {
  // نرتب اليدين من اليسار لليمين عشان كل يد تبقى في نفس الخانة
  const sorted = [...list].sort((a, b) => b[9].x - a[9].x);
  for (let i = 0; i < 2; i++) {
    const h = H[i], lm = sorted[i];
    if (!lm) { h.seen = false; h.gesture = "none"; h.count = 0; continue; }
    const px = 1 - lm[9].x, py = lm[9].y;              // مرآة: يمينك = يمين الشاشة
    if (!h.seen) { h.x = px; h.y = py; }
    h.x += (px - h.x) * 0.5; h.y += (py - h.y) * 0.5;  // تنعيم الرجفة
    h.seen = true;
    const g = classify(lm);
    if (g === h.raw) h.count++; else { h.raw = g; h.count = 1; }
    if (h.count >= STABLE) h.gesture = g;
  }
}

// ===================== 5) التحكم =====================
// الحالة اللي يتحكم فيها المستخدم
const ctl = {
  pos: new THREE.Vector3(), targetPos: new THREE.Vector3(),
  rotX: 0, rotY: 0, rotZ: 0,
  velX: 0, velY: 0,                 // استمرار اللفة بعد ما تفلت
  size: 1, targetSize: 1,
};
let grab = null, two = null, lastSwitch = 0, prevGesture = ["none", "none"];

function worldHalf() {
  const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
  return { halfW: halfH * camera.aspect, halfH };
}
// حجم يدخل الشاشة: الأشكال عرضها ~40 وحدة، نصغّرها في الشاشات الطولية
function fitScale() { return Math.min(1, (worldHalf().halfW * 0.85) / 20); }

const LABEL = { open: "✋ تحريك", fist: "✊ ماسك", pinch: "👌 قرصة", peace: "✌️ نصر", other: "…", none: "" };

function applyControls(now) {
  const a = H[0], b = H[1];
  const { halfW, halfH } = worldHalf();
  const toWorld = (h) => new THREE.Vector3((h.x - 0.5) * 2 * halfW, (0.5 - h.y) * 2 * halfH, 0);
  let state;

  if (a.seen && b.seen) {
    // ---- يدين: المسافة = الحجم، الميلان = الدوران، النص = المكان ----
    grab = null;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx * camera.aspect, dy), ang = Math.atan2(dy, dx * camera.aspect);
    if (!two) two = { d, ang, size: ctl.targetSize, rotZ: ctl.rotZ };
    ctl.targetSize = THREE.MathUtils.clamp(two.size * d / two.d, 0.3, 2.5);
    ctl.rotZ = two.rotZ - (ang - two.ang);
    ctl.targetPos.copy(toWorld(a).add(toWorld(b)).multiplyScalar(0.5));
    ctl.velX = ctl.velY = 0;
    state = "🙌 يدين: حجم " + ctl.targetSize.toFixed(1) + "×";
  } else {
    two = null;
    const h = a.seen ? a : b.seen ? b : null;
    const idx = a.seen ? 0 : 1;
    if (!h) {
      grab = null;
      state = "ما فيه يد";
    } else {
      const g = h.gesture;
      if (g === "fist") {
        // ---- قبضة: الشكل يثبت مكانه وتلفّه بحركة يدك ----
        if (!grab) grab = { x: h.x, y: h.y, rx: ctl.rotX, ry: ctl.rotY };
        const ry = grab.ry + (h.x - grab.x) * 7, rx = grab.rx + (h.y - grab.y) * 7;
        ctl.velY = ry - ctl.rotY; ctl.velX = rx - ctl.rotX;
        ctl.rotY = ry; ctl.rotX = rx;
      } else {
        grab = null;
        if (g === "open") ctl.targetPos.copy(toWorld(h));       // كف مفتوح: الشكل يلحق يدك
      }
      // قرصة أو نصر: نغيّر الشكل مرة وحدة لكل حركة
      const fresh = g !== prevGesture[idx] && now - lastSwitch > 700;
      if (fresh && g === "pinch") { changeShape(shapeIndex + 1); lastSwitch = now; }
      if (fresh && g === "peace") { changeShape(shapeIndex - 1); lastSwitch = now; }
      state = LABEL[g] || "";
    }
  }
  prevGesture = [a.gesture, b.gesture];
  document.getElementById("handState").textContent = state;
}

// دوائر صغيرة على الشاشة تبيّن وين يدك (بدون ما تخرب الشكل)
const cursors = document.getElementById("cursors");
const cctx = cursors.getContext("2d");
function drawCursors() {
  const W = cursors.width = innerWidth, Hh = cursors.height = innerHeight;
  cctx.clearRect(0, 0, W, Hh);
  for (const h of H) {
    if (!h.seen) continue;
    const x = h.x * W, y = h.y * Hh, grabbing = h.gesture === "fist";
    cctx.beginPath(); cctx.arc(x, y, grabbing ? 14 : 22, 0, Math.PI * 2);
    cctx.strokeStyle = grabbing ? "rgba(255,210,120,.9)" : "rgba(127,214,255,.7)";
    cctx.lineWidth = 2; cctx.stroke();
    cctx.font = "18px system-ui"; cctx.textAlign = "center"; cctx.textBaseline = "middle";
    cctx.fillText({ open: "✋", fist: "✊", pinch: "👌", peace: "✌️" }[h.gesture] || "", x, y);
  }
}

// ===================== 6) الحركة (كل إطار) =====================
const rot = new THREE.Matrix4(), e = rot.elements, euler = new THREE.Euler();
const center = new THREE.Vector3();
let size = 1;

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();

  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, now);
    updateHands(res.landmarks);
    drawHands(res.landmarks);
    applyControls(now);
    drawCursors();
  }

  const anyHand = H[0].seen || H[1].seen;
  if (!anyHand) ctl.targetPos.lerp(new THREE.Vector3(), 0.02);
  if (!grab) {
    // بعد ما تفلت القبضة يكمّل يلف شوي ويهدأ، وبدون يد يلف لحاله ببطء
    ctl.rotY += ctl.velY; ctl.rotX += ctl.velX;
    ctl.velY *= 0.93; ctl.velX *= 0.93;
    if (!anyHand) ctl.rotY += SHAPES[shapeIndex].still ? 0 : 0.003;
  }
  if (SHAPES[shapeIndex].still && !grab && !two) {
    // الأشكال المسطحة ترجع تواجهك عشان تبان واضحة
    const snap = (v) => Math.round(v / (Math.PI * 2)) * Math.PI * 2;
    ctl.rotY += (snap(ctl.rotY) - ctl.rotY) * 0.04;
    ctl.rotX += (snap(ctl.rotX) - ctl.rotX) * 0.04;
  }

  center.lerp(ctl.targetPos, 0.12);
  size += (ctl.targetSize * fitScale() - size) * 0.12;
  euler.set(ctl.rotX, ctl.rotY, ctl.rotZ, "ZXY");
  rot.makeRotationFromEuler(euler);

  for (let i = 0; i < COUNT; i++) {
    const k = i * 3;
    const tx = targets[k], ty = targets[k + 1], tz = targets[k + 2];
    // الهدف = نقطة الشكل بعد الدوران والحجم والمكان
    const gx = (e[0] * tx + e[4] * ty + e[8] * tz) * size + center.x;
    const gy = (e[1] * tx + e[5] * ty + e[9] * tz) * size + center.y;
    const gz = (e[2] * tx + e[6] * ty + e[10] * tz) * size;

    velocities[k]     += (gx - positions[k])     * 0.03;
    velocities[k + 1] += (gy - positions[k + 1]) * 0.03;
    velocities[k + 2] += (gz - positions[k + 2]) * 0.03;
    velocities[k] *= 0.82; velocities[k + 1] *= 0.82; velocities[k + 2] *= 0.82;
    positions[k] += velocities[k]; positions[k + 1] += velocities[k + 1]; positions[k + 2] += velocities[k + 2];
  }
  geometry.attributes.position.needsUpdate = true;
  renderer.render(scene, camera);
}
animate();
// للتجربة من الكونسول: نقدر نرسل يد وهمية
window.__debug = { updateHands, applyControls, drawCursors, H, ctl };

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
// للتجربة بدون كاميرا: المسافة أو الأسهم تغيّر الشكل
addEventListener("keydown", (ev) => {
  if (ev.code === "Space" || ev.code === "ArrowLeft") changeShape(shapeIndex + 1);
  if (ev.code === "ArrowRight") changeShape(shapeIndex - 1);
});
</script>
</body>
